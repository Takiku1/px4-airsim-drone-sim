name: PX4 Square-Flight Analysis Regression (Phase 2)

# 触发: 推到 main / PR / 手动
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  squareness-gate:
    name: Validate real-flight trajectory is a clean square
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assert golden real-flight trajectory is a square (>= threshold)
        # 背景: 云端 GitHub 托管 runner 无法可靠拉起真实 PX4 SITL —— docker run 在 runner 上
        # 会挂死(已三次验证, 与网络模式无关), 且 PX4 官方 .deb 未发布在 GitHub release。
        # 因此 Phase 2 从"云端真飞"改为"回归门禁": 用本地已验证的真实飞行遥测
        # (AirSim+PX4+MAVSDK offboard, 方形度 95.3, MAVSDK 遥测 + PX4 机载 ulog 双源交叉验证)
        # 作为 golden fixture 固化进仓库, 在 CI 中反复校验 check_square.py 的方形度评分逻辑
        # 始终能识别"干净方形"(>80)。真实 SITL 飞行作为本地/开发能力存在
        # (WSL PX4 SIH + MAVSDK offboard, 已实测 95.3), 未来可在本机 self-hosted runner 上跑真实仿真。
        run: python3 check_square.py --input tests/fixtures/trajectory_golden.csv --threshold 80

      - name: Unit tests (analysis regression)
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q tests/
