name: PX4 SITL Flight Test (Self-Hosted, SIH)

# 安全: 仅手动触发。绝不开 push / pull_request —— 公开仓库的 fork PR 会在本机执行任意代码。
on:
  workflow_dispatch:

jobs:
  self-hosted-sih-flight:
    runs-on: self-hosted
    steps:
      # 自托管 runner 跑在本人机器上, 代码就在本机 D:\AirSim\mission\px4-airsim-drone-sim
      # 直接让 wsl 跑本地仓库: 零拷贝 / 零联网(checkout 被 GFW 掐 github.com:443; cp/tar 又踩 Windows 只读对象权限)
      - name: Build & run PX4 SIH, fly square, assert squareness > 80
        # 关键: 用 powershell 而非 bash(Git Bash/MSYS2)调用 wsl。
        #   MSYS2 会对传给 wsl.exe 的 argv 做路径转换/剥离, 把 /mnt/d/... 吞掉 -> $REPO 空 -> 127。
        #   PowerShell 不做 MSYS2 转换, /mnt/d/... 原样进 wsl, wsl 的 bash 直接用它。
        #   (artifact 上传那步用 bash 没问题, 因为 path: D:\... 由 JS action 读, 不经 MSYS2 argv 转换)
        shell: powershell
        run: |
          wsl -d Ubuntu-22.04 bash /mnt/d/AirSim/mission/px4-airsim-drone-sim/scripts/run_sih_selfhosted.sh /mnt/d/AirSim/mission/px4-airsim-drone-sim

      - name: Upload SIH trajectory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sih-trajectory
          path: D:\AirSim\mission\trajectory_*.csv

      - name: Regression check vs baseline
        # 复用与 flight 步骤相同的 wsl 调用方式(PowerShell 不做 MSYS2 路径转换)。
        # 取本次飞行最新产出的 trajectory CSV, 与基线 JSON 对比;
        # baseline_check.py 遇到 FAIL(exit 1) 会使整 step 失败 -> 整个 job 变红。
        shell: powershell
        run: |
          wsl -d Ubuntu-22.04 bash -c '
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH
            REPO=/mnt/d/AirSim/mission/px4-airsim-drone-sim
            MISSION=/mnt/d/AirSim/mission
            latest=$(ls -t "$MISSION"/trajectory_*.csv 2>/dev/null | head -1)
            if [ -z "$latest" ]; then echo "ERROR: 未找到本次飞行的轨迹 CSV"; exit 2; fi
            echo "== baseline check on: $latest =="
            python3 "$REPO/scripts/baseline_check.py" --input "$latest"
          '
