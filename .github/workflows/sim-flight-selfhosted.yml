name: PX4 SITL Flight Test (Self-Hosted, SIH)

# 安全: 仅手动触发。绝不开 push / pull_request —— 公开仓库的 fork PR 会在本机执行任意代码。
on:
  workflow_dispatch:

jobs:
  self-hosted-sih-flight:
    runs-on: self-hosted
    steps:
      # 自托管 runner 跑在本人机器上, 代码就在本机 D:\AirSim\mission\px4-airsim-drone-sim
      # 直接让 wsl 跑本地仓库: 零拷贝 / 零联网(checkout 被 GFW 掐 github.com:443; cp/tar 又踩 Windows 只读对象权限)
      - name: Build & run PX4 SIH, fly square, assert squareness > 80
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1   # 关键: 阻止 Git Bash(MSYS2) 把 D:/ 改回反斜杠 D:\, 让 wsl 内部自己转
        run: |
          # 根因复盘: Git Bash 的 MSYS2 不认 /mnt/d/ 挂载点(它自己的盘符是 /d/), 直接写 /mnt/d/ 进 payload 会被整段吞掉 -> REPO 空 -> 127
          # 正确做法: 用 Git Bash 认的 D:/ 形式传(forward slash), MSYS_NO_PATHCONV 防止它反斜杠化;
          # wsl 内部用纯 bash sed 把 D:/x 转成 /mnt/d/x(不经过 MSYS2, 也不依赖 wslpath)
          wsl -d Ubuntu-22.04 -- bash -c 'WIN="D:/AirSim/mission/px4-airsim-drone-sim"; REPO=$(echo "$WIN" | sed -E "s|^([A-Za-z]):/|/mnt/\L\1/|"); echo "repo wsl path: $REPO"; bash "$REPO/scripts/run_sih_selfhosted.sh" "$REPO"'

      - name: Upload SIH trajectory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sih-trajectory
          path: D:\AirSim\mission\trajectory_*.csv
