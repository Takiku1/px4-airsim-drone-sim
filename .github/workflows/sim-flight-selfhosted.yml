name: PX4 SITL Flight Test (Self-Hosted, SIH)

# 安全: 仅手动触发。绝不开 push / pull_request —— 公开仓库的 fork PR 会在本机执行任意代码。
on:
  workflow_dispatch:

jobs:
  self-hosted-sih-flight:
    runs-on: self-hosted
    steps:
      # 自托管 runner 跑在本人机器上, 代码就在本机 D:\AirSim\mission\px4-airsim-drone-sim
      # 直接让 wsl 跑本地仓库: 零拷贝 / 零联网(checkout 被 GFW 掐 github.com:443; cp/tar 又踩 Windows 只读对象权限)
      - name: Build & run PX4 SIH, fly square, assert squareness > 80
        shell: bash
        run: |
          # 让 Git Bash(MSYS2) 把 D:/ 转成 Windows 反斜杠 D:\, 再交给 wsl 原生转回 /mnt/d/
          # (wsl 只认反斜杠 Windows 路径做参数转换, 不认 D:/ 也不认 /mnt/d/; 故不能加 MSYS_NO_PATHCONV)
          # 不用 bash -c(其内部 $()/引号会被 wsl 脆弱解析); 直接把脚本路径+参数作为 wsl 直接参数
          wsl -d Ubuntu-22.04 bash "D:/AirSim/mission/px4-airsim-drone-sim/scripts/run_sih_selfhosted.sh" "D:/AirSim/mission/px4-airsim-drone-sim"

      - name: Upload SIH trajectory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sih-trajectory
          path: D:\AirSim\mission\trajectory_*.csv
