name: PX4 SITL Flight Test (Self-Hosted, SIH)

# 安全: 仅手动触发。绝不开 push / pull_request —— 公开仓库的 fork PR 会在本机执行任意代码。
on:
  workflow_dispatch:

jobs:
  self-hosted-sih-flight:
    runs-on: self-hosted
    steps:
      # 自托管 runner 跑在本人机器上, 代码就在本机 D:\AirSim\mission\px4-airsim-drone-sim
      # 直接让 wsl 跑本地仓库: 零拷贝 / 零联网(checkout 被 GFW 掐 github.com:443; cp/tar 又踩 Windows 只读对象权限)
      - name: Build & run PX4 SIH, fly square, assert squareness > 80
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          # 路径方案(经多轮迭代最终稳定版):
          #   把 WSL 绝对路径【直接写死在单引号 payload 内】。MSYS2(NO_PATHCONV=1) 会原样传给 wsl,
          #   不依赖 "把 D:/ 转成 /mnt/d/" 的脆弱展开 —— 此前用 WIN=D:/...; ${WIN:0:1}; ${WIN:2}
          #   把 $REPO 算成了空, 导致拼出 "bash /scripts/..." -> 127 找不到文件。
          #   payload 里只有纯 POSIX 路径 /mnt/d/..., MSYS2 不解析它, wsl 的 bash 直接用它。
          wsl -d Ubuntu-22.04 -- bash -c 'REPO=/mnt/d/AirSim/mission/px4-airsim-drone-sim; bash "$REPO/scripts/run_sih_selfhosted.sh" "$REPO"'

      - name: Upload SIH trajectory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sih-trajectory
          path: D:\AirSim\mission\trajectory_*.csv
