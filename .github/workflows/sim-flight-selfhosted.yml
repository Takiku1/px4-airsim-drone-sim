name: PX4 SITL Flight Test (Self-Hosted, SIH)

# 安全: 仅手动触发。绝不开 push / pull_request —— 公开仓库的 fork PR 会在本机执行任意代码。
on:
  workflow_dispatch:

jobs:
  self-hosted-sih-flight:
    runs-on: self-hosted
    steps:
      # 自托管 runner 跑在本人机器上, 代码就在本机 D:\AirSim\mission\px4-airsim-drone-sim
      # 直接让 wsl 跑本地仓库: 零拷贝 / 零联网(checkout 被 GFW 掐 github.com:443; cp/tar 又踩 Windows 只读对象权限)
      - name: Build & run PX4 SIH, fly square, assert squareness > 80
        shell: bash
        run: |
          # runner 本机仓库 Windows 路径: D:\AirSim\mission\px4-airsim-drone-sim
          WINREPO='D:\AirSim\mission\px4-airsim-drone-sim'
          # 在 Git Bash 里用 sed 把 Windows 路径转成 WSL 路径 (D:\x -> /mnt/d/x)
          # 不依赖 wslpath(本发行版 wslpath -u 对反斜杠路径返回空, 导致 $REPO 空 -> 127)
          WSL_REPO=$(printf '%s' "$WINREPO" | sed -E 's|\\|/|g; s|^([A-Za-z]):|/mnt/\L\1|')
          echo "WSL_REPO=$WSL_REPO"
          # 通过环境变量传 WSL 路径: 环境变量值不受 MSYS 参数路径转换影响, wsl 内直接读, 不再调 wslpath
          # 兜底: 若环境变量没透传, 退回硬编码的 WSL 路径
          REPO_WSL="$WSL_REPO" wsl -d Ubuntu-22.04 -- bash -c 'REPO="${REPO_WSL:-/mnt/d/AirSim/mission/px4-airsim-drone-sim}"; echo "repo wsl path: $REPO"; ls -l "$REPO/scripts/run_sih_selfhosted.sh" && bash "$REPO/scripts/run_sih_selfhosted.sh" "$REPO"'

      - name: Upload SIH trajectory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sih-trajectory
          path: D:\AirSim\mission\trajectory_*.csv
