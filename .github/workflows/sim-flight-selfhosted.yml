name: PX4 SITL Flight Test (Self-Hosted, SIH)

# 安全: 仅手动触发。绝不开 push / pull_request —— 公开仓库的 fork PR 会在本机执行任意代码。
on:
  workflow_dispatch:

jobs:
  self-hosted-sih-flight:
    runs-on: self-hosted
    steps:
      # 自托管 runner 跑在本人机器上, 代码就在本机 D:\AirSim\mission\px4-airsim-drone-sim
      # 直接让 wsl 跑本地仓库: 零拷贝 / 零联网(checkout 被 GFW 掐 github.com:443; cp/tar 又踩 Windows 只读对象权限)
      - name: Build & run PX4 SIH, fly square, assert squareness > 80
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1   # 彻底关闭 Git Bash 对参数里 /mnt/d/... 的路径转换
        run: |
          # 仓库在 WSL 内的路径是固定的 (/mnt/d/ == Windows D:), 直接硬编码进单引号 payload,
          # 不依赖 wslpath / env 变量 / sed —— 这些在前几版都因 MSYS 转换或发行版差异返回空, 导致 127。
          wsl -d Ubuntu-22.04 -- bash -c 'REPO=/mnt/d/AirSim/mission/px4-airsim-drone-sim; echo "repo wsl path: $REPO"; ls -l "$REPO/scripts/run_sih_selfhosted.sh" && bash "$REPO/scripts/run_sih_selfhosted.sh" "$REPO"'

      - name: Upload SIH trajectory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sih-trajectory
          path: D:\AirSim\mission\trajectory_*.csv
