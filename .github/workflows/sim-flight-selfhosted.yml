name: PX4 SITL Flight Test (Self-Hosted, SIH)

# 安全: 仅手动触发。绝不开 push / pull_request —— 公开仓库的 fork PR 会在本机执行任意代码。
on:
  workflow_dispatch:

jobs:
  self-hosted-sih-flight:
    runs-on: self-hosted
    steps:
      # 自托管 runner 跑在本人机器上, 代码就在本机 D:\AirSim\mission\px4-airsim-drone-sim
      # 直接让 wsl 跑本地仓库: 零拷贝 / 零联网(checkout 被 GFW 掐 github.com:443; cp/tar 又踩 Windows 只读对象权限)
      - name: Build & run PX4 SIH, fly square, assert squareness > 80
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          # 路径转换最终方案(经多轮迭代验证):
          #   MSYS2 把 /d/AirSim/... 可靠转成 D:/AirSim/...(forward slash, 不会被吞, 也不触发 wsl 转换)
          #   进 wsl 后用【纯 bash 参数展开】把 D:/x 转成 /mnt/d/x(无 wslpath/sed/引号, 最稳)
          #   不用反斜杠(被 MSYS2 当转义吞掉)、不用双引号(被 MSYS2 转义成 \")、不用 wslpath(反斜杠形式返回空)
          wsl -d Ubuntu-22.04 -- bash -c 'WIN=D:/AirSim/mission/px4-airsim-drone-sim; D=${WIN:0:1}; D=${D,,}; REPO=/mnt/$D/${WIN:2}; bash $REPO/scripts/run_sih_selfhosted.sh $REPO'

      - name: Upload SIH trajectory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sih-trajectory
          path: D:\AirSim\mission\trajectory_*.csv
